services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: twin-mosquitto
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: twin-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  edge:
    build: ./edge
    container_name: twin-edge
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      KAFKA_BOOTSTRAP: kafka:9092
      DB_PATH: /data/edge.db
      BUFFER_MAX_ROWS: "500"
      SYNC_INTERVAL_SECONDS: "1"
      EDGE_API_PORT: "8080"
    ports: ["8080:8080"]
    volumes:
      - edge_data:/data
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_started
    mem_limit: 256m
    restart: unless-stopped

  cloud:
    build: ./cloud
    container_name: twin-cloud
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: twin-events
      DB_PATH: /data/cloud.db
    ports: ["8081:8081"]
    volumes:
      - cloud_data:/data
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  sensor:
    build: ./edge
    container_name: twin-sensor
    command: ["python", "sensor.py"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SENSOR_INTERVAL_SECONDS: "2"
    depends_on:
      - mosquitto
    profiles: ["sensor"]
    restart: unless-stopped

volumes:
  kafka_data:
  edge_data:
  cloud_data:
